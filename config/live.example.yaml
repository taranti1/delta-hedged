# Live / paper runner configuration (dh.live.config.load_live_config). Copy to
# config/live.yaml and edit. Unknown keys are errors. No secrets in here: the Kalshi key id and
# private-key PATH come from the environment (KALSHI_KEY_ID, KALSHI_PRIVATE_KEY_PATH, or the
# names/env file set in config/kalshi.yaml auth.*), see
# config/kalshi.example.yaml and docs/RUNBOOK.md.
#
# Strategy parameters (sizes, limits, timers) are NOT here: they live in config/m1.yaml.

# paper = shadow trading against the live book through the conservative simulator (no orders).
# live  = real orders; ALSO requires --i-understand-this-sends-real-orders on the command line.
mode: paper
session: m1                    # free label written into logs / meta records
kalshi_config: ""              # '' = config/kalshi.yaml, else config/kalshi.example.yaml
kalshi_env: ""                 # '' = the kalshi config's env (prod | demo)

paths:
  data_root: data/live         # raw capture of THIS process; never the collector's root.
                               # One runner per data_root (flock on <data_root>/runner.lock)
  log_dir: data/live_logs      # JSON-lines: decisions (Log actions), actions, venue results
  # '' = the platform's runtime dir: /run/dh/... on Linux (tmpfs: `sudo mkdir -p /run/dh` after
  # every boot), data/run/... under the repository on macOS (created on demand; no /run there)
  kill_file: ""                # `echo why > <run dir>/KILL` -> group trigger + cancel all + stop (stops paper too)
  heartbeat_file: ""           # the LIVE runner's (<run dir>/heartbeat.json); read by scripts/watchdog.py
  paper_heartbeat_file: ""     # paper runner; '' = <run dir>/heartbeat.paper.json (never the live file)
  risk_state_file: ""          # day P&L / carried halt / pause; '' = <data_root>/state/risk_state.<mode>.json

metrics:
  enabled: true
  host: 127.0.0.1              # Prometheus text at http://127.0.0.1:9108/metrics, JSON at /health
  port: 9108

loop:
  heartbeat_interval_s: 0.5
  kill_check_interval_s: 0.2
  metrics_refresh_s: 1.0
  max_lag_s: 1.0               # data lag (runner queue or exchange time) above this: NEW orders
                               # blocked AND the strategy cancels its quotes (runner.lag stale)
  lag_resume_s: 2.0            # ... until fresh data kept the lag < max_lag_s/2 this long
  lag_window_s: 600.0          # trailing window of the exchange-time latency baseline
  lag_confirm_s: 0.5           # exchange-time lag = smallest excess over this window (relay batching)
  lag_baseline_cap_ms: 0.0     # the baseline never exceeds this (0 = clock_block_ms + 100): a backlog
                               # present from the start or longer than lag_window_s stays lag.
                               # dh_lag_baseline_seconds shows each source's uncapped baseline; raise
                               # the cap only after measuring a larger normal latency (paper mode)
  yield_items: 64              # the consumer yields to the event loop every N items / N ms,
  yield_ms: 5.0                # and after every item that sent orders
  shutdown_timeout_s: 10.0     # 'stopping' heartbeats stop after this (the watchdog takes over)
  strategy_error: stop         # stop | continue ('continue' is refused in live mode)
  clock_sample_s: 60.0         # chrony/timedatectl (macOS: query-only `sntp`) sample -> 'clock' stream +
                               # dh_clock_offset_seconds (must be > 0 in live mode)
  clock_resample_s: 5.0        # while the last sample was bad or unmeasurable: sample this often
  clock_alarm_ms: 5.0          # |offset| above this: alarm (macOS runs ~35-50 ms off NTP: use ~100 there)
  clock_block_ms: 250.0        # |offset| above this on clock_block_samples checks in a row:
  clock_block_samples: 2       # new orders blocked (restart re-anchors the session clock)
  clock_max_est_error_ms: 0.0  # live: a sample must come from chronyc/timedatectl and be synchronised
                               # (macOS: `sntp` answered), with an estimated error <= this
                               # (0 = clock_block_ms), else it blocks like a large offset
  risk_state_interval_s: 2.0   # persist the day's risk state this often (and on every halt)

venue:
  # Deployment (docs/RUNBOOK.md 1.2): System 1 trades subaccount 1 of an account SHARED with another
  # live system (which owns subaccount 0 and must never be touched). FAIL-CLOSED: live mode, the
  # venue and the watchdog REFUSE a config that does not state subaccount and shared_account here.
  subaccount: 1                # Kalshi subaccount number, sent EXPLICITLY on every request (omitted =
                               # ALL subaccounts on GET orders/fills and cancel-all). Use a DEDICATED
                               # subaccount: the cancel-all and the ghost sweep act on all its orders;
                               # other subaccounts' WS events are dropped. 0 (the primary account) is
                               # refused unless allow_primary_account: true AND shared_account: false
  shared_account: true         # REQUIRED. true: live refuses subaccount 0, rate_limits.account_share
                               # > 0.5 (config/kalshi.yaml) and key_restricted_to_subaccount: false;
                               # every write must name this subaccount; the bulk cancel-all
                               # (DELETE /portfolio/events/orders) is NEVER sent: orders are cancelled
                               # by id (order-group trigger, then list + batch cancel until empty)
  key_restricted_to_subaccount: true  # runner + watchdog keys are restricted to `subaccount`, PROVEN at
                               # start-up: GET /portfolio/balance?subaccount=0 must be refused with
                               # HTTP 403 by the runner key (a 401 = key rejected: refused, not proof).
                               # Private WS messages without a subaccount field are then ours (Kalshi
                               # scopes the channels to the key); fills / order updates with another
                               # system's client_order_id (no dhm1- prefix) are dropped anyway
                               # (dh_foreign_order_events_total); ones WITHOUT a client id of an order
                               # not known yet are parked (unknown_order_* below), never dropped
  allow_primary_account: false # the ONLY way to trade subaccount 0 (with shared_account: false)
  exchange_indexes: [2]        # shards traded AND funded (every KXBTC* market is on shard 2); markets
                               # on an unknown / other shard are never traded; one order group per shard
  min_balance_margin_dollars: 10.0  # each shard's funds (available balance + our positions at cost +
                               # resting-order collateral) >= worst-case loss (m1: $50) + this, at
                               # start-up (else exit 2) and every balance_interval_s (else new orders blocked)
  balance_interval_s: 60.0
  balance_max_failures: 3      # this many failed balance reads in a row close the gate 'balance'
  exchange_status_interval_s: 10.0  # GET /exchange/status (trading / exchange pauses; live: > 0)
  exchange_status_max_failures: 3   # this many failed status polls in a row close 'exchange_pause'
                               # (reason: exchange status unreadable) until a poll succeeds
  exchange_schedule_interval_s: 3600.0  # GET /exchange/schedule (maintenance, Thursday 03:00-05:00 ET pause)
  pause_lead_s: 60.0           # quotes pulled this long before a scheduled closure
  pause_reject_hold_s: 30.0    # a place rejected for a pause blocks new orders this long: every market
                               # for an exchange-level reason, only that market for a market-level one
  max_batch: 20                # places / cancels per batched request
  max_place_wait_s: 0.5        # quotes that would wait longer for write tokens are dropped
  self_trade_prevention: taker_at_cross
  reconcile_backoff_s: [0.5, 1.0, 2.0, 4.0, 8.0, 15.0, 30.0]
  reconcile_missing_after_s: 30.0
  reconcile_min_attempts: 3
  create_match_skew_s: 2.0          # a lookup match must be created >= request time - this
  missing_recheck_s: [10.0, 30.0]   # a create declared missing is looked for again (cancelled if resting)
  max_cancel_retries: 5             # re-cancels of a still-resting order before the STUCK alarm
                                    # (re-cancelling never stops while it rests)
  recancel_backoff_max_s: 5.0
  queue_positions_interval_s: 2.0   # GET /portfolio/orders/queue_positions (0 = off)
  queue_positions_resync: false     # true overwrites the estimator (breaks replay parity)
  queue_positions_max_tickers: 20
  read_reserve_tokens: 30.0
  positions_interval_s: 30.0        # GET /portfolio/positions reconciliation (0 = off)
  position_confirm_s: 5.0           # a mismatch must persist this long before Halt(all)
  position_defer_max: 5             # a positions read older than the last WS fill OF THAT MARKET does not
  position_defer_max_s: 60.0        # confirm (deferred), at most this often / this long after the mismatch
                                    # was first seen; then the next read validated after that confirms
  ghost_sweep: true                 # cancel resting orders the strategy does not know
  fills_backfill_interval_s: 60.0   # GET /portfolio/fills safety net (0 = off)
  fills_backfill_margin_s: 120.0    # look-back overlap (duplicates are dropped by trade/fill id)
  fills_backfill_min_age_s: 10.0    # the periodic pass leaves younger fills to the WebSocket
  reconnect_settle_s: 2.0           # after a WS reconnect: wait, then back-fill fills + positions + orders
  # A fill / order update WITHOUT client_order_id (optional on WS fills; REST fills never carry it)
  # of an order id not known yet (it beat our create's response, or the create is being reconciled)
  # is PARKED, then released as soon as the id is known (ack, reconciliation, or a read-only
  # GET /portfolio/orders/{id} showing our dhm1- prefix on our subaccount). Proven foreign: dropped
  # (ERROR). Still unknown after unknown_order_park_s: dropped (ERROR) and quoting paused through the
  # reconcile path (fills, positions, orders re-read). The release is recorded (replay-exact).
  unknown_order_park_s: 10.0
  unknown_order_lookup_delay_s: 1.0 # first GET order after this (the create response usually wins)
  unknown_order_lookup_retry_s: 2.0 # then every this while parked (404 / read error)
  unknown_order_park_max: 1000      # parked events in all; beyond: the oldest order times out
  reconcile_retry_max_s: 30.0
  startup_cancel_all: true          # cancel (and verify) leftovers BEFORE reading positions; required live
  cancel_all_hold_s: 60.0           # Kalshi may cancel orders placed within 1 min of a BULK cancel-all:
                                    # new orders are held this long after one. Only an account declared
                                    # NOT shared sends it; a shared account cancels by id: no hold
  cancel_rounds: 3                  # list + cancel-by-id rounds of a scoped cancel-all before it alarms
  exclude_events_with_positions: true   # required live (held positions are not seeded into the strategy)
  shutdown_delete_group: true
  halt_on_fee_mismatch: true

universe:
  series: []                   # [] = strategy quoting.enabled_series (KXBTCD in M1)
  horizon_s: 7200.0            # trade markets expiring within 2 h (current + next hour)
  discovery_interval_s: 120.0  # hourly roll-over: new markets added via MarketMaker.add_markets
  prune_after_s: 900.0
  market_channels: [orderbook_delta, trade]
  max_markets_per_subscription: 100
  index_ids: [BRTI]

backfill:                      # fair-value warm-up (>= 1 day needed; 2 days at 1-minute sampling)
  enabled: true
  index_id: BRTI
  days: 2.0
  step_s: 60
  chunk_s: 3600                # = the timespan (HOUR)
  # GET /cfbenchmarks/history/values?id=BRTI&timespan=<timespan>&timestamp=<timestamp>
  # placeholders: {start_ms} {end_ms} {start_s} {end_s} {span_s} {span_ms} {start_iso} {end_iso}.
  # VERIFIED LIVE 2026-09-25: timespan=HOUR & timestamp=<hour START, ISO ms "...T17:00:00.000Z">
  # -> that hour's BRTI ticks at 5 Hz. CF requires the timestamp truncated to the timespan: align.
  timespan: "HOUR"
  timestamp: "{start_iso}"
  align: true
  recent_delay_s: 1800         # CF publishes history with up to 15 min delay: empty newest chunk skipped
  extra_params: {}
  min_coverage: 0.9

paper:                         # shadow-trading simulator (dh.execution.exchange_sim)
  policy: conservative         # C: cancels ahead of us are assumed behind, latency x1.5
  seed: 7
  submit_ms: 40.0              # replace with measured REST round trips (dh_rest_rtt_seconds)
  response_ms: 40.0
  ws_ms: 25.0
  sigma: 0.4
  latency_multiplier: null

feeds:                         # external venues (OFF in M1, deliberately)
  config: config/feeds.yaml
  # [] = none. M1 prices and detects jumps on BRTI alone; with no external feeds the risk
  # engine's ">= 2 fresh external venues" rule is OFF and staleness is judged on BRTI receive
  # AND source age (10 s; 3 s within 10 min of expiry). External order books would only add
  # load to the single strategy consumer. If ever enabled: trade/ticker channels only.
  only: []

watchdog:                      # scripts/watchdog.py (locks onto the live runner it armed on)
  stale_s: 2.0
  poll_s: 0.25
  retry_s: 1.0
  repeat_s: 30.0
  max_repeats: 10
  only_live: true
  stopping_grace_s: 5.0        # a 'stopping' runner older than its shutdown_timeout_s + this: cancel all
  key_id_env: KALSHI_WATCHDOG_KEY_ID   # its own key, restricted to venue.subaccount (RUNBOOK 1.2);
  private_key_path_env: KALSHI_WATCHDOG_PRIVATE_KEY_PATH  # without them it REFUSES on a shared account
  allow_runner_key: false      # true: may sign with the runner's key instead (a deliberate, logged choice)
  beat_interval_s: 1.0         # the watchdog writes <heartbeat>.watchdog (pid, subaccount, state, armed
                               # runner, last poll) this often; EXITED when it stops
  runner_max_age_s: 10.0       # LIVE RUNNER: refuses to start without a watchdog beat for its subaccount
                               # younger than this, and blocks new orders (gate 'watchdog', quotes
                               # pulled) while it is older, names another subaccount, or is not armed
                               # on this runner once it has been running this long
  api_probe_interval_s: 60.0   # CAPABILITY: the watchdog reads GET /portfolio/orders?subaccount=<n>&
  api_probe_timeout_s: 10.0    # status=resting&limit=1 with its OWN key at start and this often; its
  api_max_age_s: 180.0         # beat carries api_ok + the last success. LIVE RUNNER: api_ok false or a
                               # last success older than api_max_age_s = not protecting (start refused,
                               # gate 'watchdog' closed)
  max_future_s: 2.0            # a beat (runner side) or runner heartbeat (watchdog side) stamped more
                               # than this in the FUTURE is not fresh: the runner gates, the watchdog
                               # treats it like a stale heartbeat (it fires)

disk:                          # free space of paths.data_root's filesystem (decimal GB; live only)
  min_free_gb_start: 10.0      # below: the live runner refuses to start (exit 2)
  min_free_gb_gate: 5.0        # below: new orders blocked (gate 'disk'), the strategy pulls its quotes
  resume_margin_gb: 1.0        # ... until free >= min_free_gb_gate + this
  check_interval_s: 60.0
