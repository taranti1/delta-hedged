# Kalshi trading fee rates by series fee_type. The fee TYPE and MULTIPLIER are never assumed:
# they are read per series (GET /series/{t}: fee_type, fee_multiplier) with event-level
# overrides (GET /events/fee_changes, WS event_fee_update), and every fill's reported
# fee_cost is reconciled against this model (mismatch => alert + halt new quoting).
#
# Unrounded fee per fill = multiplier * rate * contracts * P * (1 - P), P = YES price in dollars
# (identical for YES and NO side since P(1-P) is symmetric).
# Rounding: trade fee is ceiled to $0.000001; the order's cash impact is aligned to the
# account balance precision with the residual carried per order and rebated when it exceeds
# one unit (Kalshi fee-rounding rules; see dh/kalshi/fees.py docstring).
#
# Provenance: Kalshi Fee Schedule ("Fee Schedule for July 2026 - 7.7.26 Update",
# https://kalshi.com/docs/kalshi-fee-schedule.pdf; canonical page
# https://kalshi.com/regulatory/fee-schedule). Could not be fetched from the build environment
# (egress blocked); rates cross-checked against taranti1/trading-strategy fees/engine.py
# (reconciled against live fills) and public secondary sources. RE-VERIFY before live trading:
# scripts/verify_fee_schedule.py compares these rates with fills' fee_cost.
effective_from: "2026-07-07"
verified_against_live_fills: false
rates:
  taker: "0.07"
  maker:
    quadratic: "0"                             # no maker fee
    quadratic_with_maker_fees: "0.0175"
    quadratic_with_combo_maker_fees: "0.035"   # combo/multivariate markets
  flat: null                                   # unsupported: refuse to trade (never price as 0)
balance_precision_dollars: "0.01"              # non-direct members; direct members may be finer

# Hedge venue fees (bps of notional). Kalshi BTC perp (KXBTCPERP) published tiers by 30-day
# volume: taker 12.0 -> 2.6 bps, maker 5.0 -> 0.6 bps (secondary sources; perps fee page and
# perps.openapi.yaml were not reachable). Set current_tier from the account at runtime.
hedge_venues:
  kalshi_perp:
    symbol: KXBTCPERP
    maker_bps_by_tier: [5.0, 4.0, 3.0, 2.0, 1.2, 0.6]      # PLACEHOLDER intermediate tiers: verify
    taker_bps_by_tier: [12.0, 10.0, 8.0, 6.0, 4.0, 2.6]    # PLACEHOLDER intermediate tiers: verify
    current_tier: 0
    funding_interval_hours: 8
