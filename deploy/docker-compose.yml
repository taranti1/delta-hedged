# One VM (AWS us-east-1 recommended). Roles are separate processes so a crash in one never
# stops capture, and the watchdog can always cancel orders.
#
# Secrets live on the host, outside the repo:
#   /secrets/dh.env                            KALSHI_KEY_ID=...  KALSHI_WATCHDOG_KEY_ID=...
#   /secrets/kalshi_private_key.pem            trading key (recorder + strategy)
#   /secrets/kalshi_watchdog_private_key.pem   separate key for the watchdog (docs/RUNBOOK.md)
x-secrets: &secrets
  env_file: ["/secrets/dh.env"]
  environment:
    KALSHI_PRIVATE_KEY_PATH: /secrets/kalshi_private_key.pem
    KALSHI_WATCHDOG_PRIVATE_KEY_PATH: /secrets/kalshi_watchdog_private_key.pem
services:
  recorder:
    build: {context: .., dockerfile: deploy/Dockerfile}
    command: ["scripts/record.py", "--config", "config/feeds.yaml", "--root", "/data/raw"]
    volumes: ["/data:/data", "/secrets:/secrets:ro"]
    <<: *secrets
    restart: always
  strategy:
    build: {context: .., dockerfile: deploy/Dockerfile}
    # paper by default; live needs mode: live in the live config AND
    # --i-understand-this-sends-real-orders here (docs/RUNBOOK.md)
    command: ["scripts/run_live.py", "--config", "config/m1.yaml", "--live-config", "config/live.docker.yaml",
              "--mode", "paper"]
    # /run/chrony: chronyc reaches the host's chronyd, so the runner's clock-offset gate can
    # measure the offset (it fails closed in live mode when it cannot)
    volumes: ["/data:/data", "/secrets:/secrets:ro", "/run/dh:/run/dh", "/run/chrony:/run/chrony:ro"]
    <<: *secrets
    restart: "no"          # never auto-restart a trading process: a human decides
    ports: ["127.0.0.1:9108:9108"]   # metrics (the container binds 0.0.0.0, the host only loopback)
  watchdog:
    build: {context: .., dockerfile: deploy/Dockerfile}
    # --arm-on-start: a watchdog (re)started after the runner died must still cancel its orders
    command: ["scripts/watchdog.py", "--live-config", "config/live.docker.yaml", "--heartbeat",
              "/run/dh/heartbeat.json", "--max-age-s", "2", "--arm-on-start"]
    volumes: ["/secrets:/secrets:ro", "/run/dh:/run/dh"]
    <<: *secrets
    restart: always
  prometheus:
    image: prom/prometheus:latest
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    network_mode: host
  grafana:
    image: grafana/grafana:latest
    network_mode: host
